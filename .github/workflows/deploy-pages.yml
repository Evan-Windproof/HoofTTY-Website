name: Deploy HoofTTY Website

on:
  push:
    branches:
      - main
    paths:
      - "projects/hooftty/**"
      - "CNAME"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hooftty-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate website files
        run: |
          test -f projects/hooftty/index.html
          test -f projects/hooftty/hooftty.css
          test -f projects/hooftty/evan.png
          test -f projects/hooftty/silkscreen.woff2
          test -f CNAME

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp -a projects/hooftty/. _site/
          cp CNAME _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
